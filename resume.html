<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard-container">

<div class="sidebar">

<h2>💜 SmartHire</h2>

<ul>
<li onclick="window.location.href='dashboard.html'">🏠 Dashboard</li>
<li onclick="window.location.href='profile.html'">👤 My Profile</li>
<li onclick="window.location.href='resume.html'">📄 Resume Builder</li>
<li onclick="window.location.href='jobs.html'">💼 Jobs Portal</li>
<li onclick="window.location.href='applications.html'">📨 Applications</li>
<li onclick="window.location.href='notifications.html'">🔔 Notifications</li>
<li onclick="toggleTheme()">🌙 Dark Mode</li>
<li onclick="logout()">🚪 Logout</li>
</ul>

</div>

<div class="main-content">

<h1>📄 Resume Builder</h1>

<div class="job-card">

<input type="text" id="resumeName" placeholder="Full Name">

<br><br>

<input type="email" id="resumeEmail" placeholder="Email">

<br><br>

<input type="text" id="resumePhone" placeholder="Phone Number">

<br><br>

<textarea id="resumeSkills" placeholder="Skills"></textarea>

<br><br>

<textarea id="resumeEducation" placeholder="Education"></textarea>

<br><br>

<textarea id="resumeExperience" placeholder="Experience"></textarea>

<br><br>

<button onclick="saveResume()">
Save Resume
</button>

<button onclick="downloadResume()">
Download Resume
</button>

</div>

<div class="job-card">

<h2>Resume Preview</h2>

<div id="resumePreview"></div>

</div>

</div>

</div>

<script src="script.js"></script>

<script>

loadResume();

</script>

</body>
</html>
